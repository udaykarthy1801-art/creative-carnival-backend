services:
  - type: web
    name: creative-carnival-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAMESITE
        value: none
      - key: ALLOWED_ORIGINS
        value: https://udaykarthy1801-art.github.io
      - key: ADMIN_USERNAME
        value: admin
      - key: SESSION_HOURS
        value: '8'
      - key: REGISTRATION_RATE_LIMIT
        value: '60'
      - key: REGISTRATION_RATE_WINDOW_MINUTES
        value: '15'
      - key: DB_CONNECTION_LIMIT
        value: '10'
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DB_SSL_CA
        value: /etc/secrets/aiven-ca.pem
